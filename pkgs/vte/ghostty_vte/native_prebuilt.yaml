# ghostty_vte native_prebuilt configuration.
# This file is the source of truth for native builds and releases.

schema: 1
package: ghostty_vte
asset_name: ghostty_vte_bindings_generated.dart
library_stem: ghostty-vt
link_mode: dynamic_library

source:
  type: git
  repository: https://github.com/ghostty-org/ghostty
  revision: f2d5758f6305867dc36b36293c6165d8152b853e

release:
  provider: github
  repository: kingwill101/dart_terminal
  tag: ghostty_vte-v0.2.0-beta.2

variables:
  cmake_build_directory: "{{ work }}/build-{{ target.label }}"
  cmake_target: zig_build_lib_vt
  library_path: "{{ source.path }}/zig-out/{{ library.versioned_name }}"
  # Keep release artifacts on Ghostty's portable non-SIMD path. Native SIMD
  # links the build host's libc/libm and can raise the Linux glibc floor.
  ghostty_zig_build_flags: "-Dtarget={{ target.zig_target }};-Dsimd=false"
  # Non-SIMD Android still references getauxval, so link Bionic explicitly.
  ghostty_libc_patch_url: "https://raw.githubusercontent.com/kingwill101/dart_terminal/8c717dba6e3be89afe402c1e9b5cee7a6a8c997b/pkgs/vte/ghostty_vte/patches/ghostty-libvt-link-libc.patch"

build:
  options:
    library_version: 0.1.0
  recipes:
    - target: {os: linux, architecture: x64}
      steps: &ghostty_steps
        - id: configure
          type: cmake_configure
          source_directory: "{{ source.path }}"
          build_directory: "{{ variables.cmake_build_directory }}"
          definitions:
            CMAKE_BUILD_TYPE: Release
            GHOSTTY_ZIG_BUILD_FLAGS: "{{ variables.ghostty_zig_build_flags }}"
        - id: build
          type: cmake_build
          build_directory: "{{ variables.cmake_build_directory }}"
          targets: ["{{ variables.cmake_target }}"]
        - id: export
          type: export_artifact
          artifact: ghostty-vt
          primary: "{{ variables.library_path }}"

    - target: {os: linux, architecture: arm64}
      steps: *ghostty_steps
    - target: {os: macos, architecture: x64}
      steps: *ghostty_steps
    - target: {os: macos, architecture: arm64}
      steps: *ghostty_steps

    - target: {os: windows, architecture: x64}
      steps: &ghostty_windows_steps
        - id: configure
          type: cmake_configure
          source_directory: "{{ source.path }}"
          build_directory: "{{ variables.cmake_build_directory }}"
          generator: Ninja
          definitions:
            CMAKE_BUILD_TYPE: Release
            GHOSTTY_ZIG_BUILD_FLAGS: "{{ variables.ghostty_zig_build_flags }}"
        - id: build
          type: cmake_build
          build_directory: "{{ variables.cmake_build_directory }}"
          targets: ["{{ variables.cmake_target }}"]
        - id: export
          type: export_artifact
          artifact: ghostty-vt
          primary: "{{ variables.library_path }}"

    - target: {os: windows, architecture: arm64}
      steps: *ghostty_windows_steps
    - target: {os: android, architecture: arm64}
      steps: &ghostty_android_steps
        - id: patch_libc
          type: command
          working_directory: "{{ source.path }}"
          commands:
            - [curl, --fail, --location, --output, "{{ work }}/ghostty-libvt-link-libc.patch", "{{ variables.ghostty_libc_patch_url }}"]
            - [sh, -c, "if git apply --check \"$1\"; then git apply \"$1\"; elif git apply --reverse --check \"$1\"; then :; else exit 1; fi", sh, "{{ work }}/ghostty-libvt-link-libc.patch"]
        - id: configure
          type: cmake_configure
          source_directory: "{{ source.path }}"
          build_directory: "{{ variables.cmake_build_directory }}"
          definitions:
            CMAKE_BUILD_TYPE: Release
            GHOSTTY_ZIG_BUILD_FLAGS: "{{ variables.ghostty_zig_build_flags }}"
        - id: build
          type: cmake_build
          build_directory: "{{ variables.cmake_build_directory }}"
          targets: ["{{ variables.cmake_target }}"]
        - id: verify_page_size
          type: command
          needs: [build]
          commands:
            - [sh, -ceu, "tool=$(command -v readelf || command -v llvm-readelf || true); [ -n \"$tool\" ] || { echo \"readelf or llvm-readelf is required\" >&2; exit 1; }; if ! headers=$(\"$tool\" -lW \"$1\"); then echo \"failed to inspect ELF program headers\" >&2; exit 1; fi; found=0; for alignment in $(printf '%s\\n' \"$headers\" | awk '$1 == \"LOAD\" {print $NF}'); do found=1; if [ $((alignment)) -lt 16384 ]; then echo \"LOAD alignment $alignment is below 0x4000\" >&2; exit 1; fi; done; [ \"$found\" -eq 1 ] || { echo \"no ELF LOAD segments found\" >&2; exit 1; }", sh, "{{ variables.library_path }}"]
        - id: export
          type: export_artifact
          needs: [verify_page_size]
          artifact: ghostty-vt
          primary: "{{ variables.library_path }}"
    - target: {os: android, architecture: arm}
      steps: *ghostty_android_steps
    - target: {os: android, architecture: x64}
      steps: *ghostty_android_steps
    - target: {os: ios, architecture: arm64, sdk: iphoneos}
      steps: *ghostty_steps
    - target: {os: ios, architecture: arm64, sdk: iphonesimulator}
      steps: *ghostty_steps
    - target: {os: ios, architecture: x64, sdk: iphonesimulator}
      steps: *ghostty_steps

artifacts:
  linux-x64:
    archive: vte-linux-x64.tar.gz
  linux-arm64:
    archive: vte-linux-arm64.tar.gz
  macos-arm64:
    archive: vte-macos-arm64.tar.gz
  macos-x64:
    archive: vte-macos-x64.tar.gz
  windows-x64:
    archive: vte-windows-x64.tar.gz
  windows-arm64:
    archive: vte-windows-arm64.tar.gz
  android-arm64:
    archive: vte-android-arm64.tar.gz
  android-arm:
    archive: vte-android-arm.tar.gz
  android-x64:
    archive: vte-android-x64.tar.gz
  ios-arm64:
    archive: vte-ios-arm64.tar.gz
  ios-sim-arm64:
    archive: vte-ios-sim-arm64.tar.gz
  ios-sim-x64:
    archive: vte-ios-sim-x64.tar.gz
