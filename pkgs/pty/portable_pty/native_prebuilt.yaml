# portable_pty native_prebuilt configuration.
# This file is the source of truth for native builds and releases.

schema: 1
package: portable_pty
asset_name: portable_pty_bindings_generated.dart
library_stem: portable_pty_rs
link_mode: dynamic_library

source:
  type: git
  repository: https://github.com/kingwill101/dart_terminal
  revision: 2100251eb45083ee35b6eaeac78d49862fb0007b
  subdirectory: pkgs/pty/portable_pty

release:
  provider: github
  repository: kingwill101/dart_terminal
  tag: portable_pty-v0.0.7-beta.1

variables:
  cargo_manifest: "{{ source.path }}/rust/Cargo.toml"
  library_path: "{{ source.path }}/rust/target/{{ target.rust_target }}/release/{{ library.name }}"

build:
  recipes:
    - target: {os: linux, architecture: x64}
      steps: &cargo_dynamic_steps
        - id: build
          type: command
          working_directory: "{{ source.path }}/rust"
          commands:
            - [cargo, build, --manifest-path, "{{ variables.cargo_manifest }}", --release, --target, "{{ target.rust_target }}"]
        - id: export
          type: export_artifact
          artifact: portable_pty_rs
          primary: "{{ variables.library_path }}"

    - target: {os: linux, architecture: arm64}
      steps: *cargo_dynamic_steps
    - target: {os: macos, architecture: x64}
      steps: *cargo_dynamic_steps
    - target: {os: macos, architecture: arm64}
      steps: *cargo_dynamic_steps
    - target: {os: windows, architecture: x64}
      steps: *cargo_dynamic_steps
    - target: {os: windows, architecture: arm64}
      steps: *cargo_dynamic_steps

    - target: {os: android, architecture: arm64}
      steps: &cross_dynamic_steps
        - id: build
          type: command
          working_directory: "{{ source.path }}/rust"
          commands:
            - [cross, build, --manifest-path, "{{ variables.cargo_manifest }}", --release, --target, "{{ target.rust_target }}"]
        - id: verify_page_size
          type: command
          needs: [build]
          commands:
            - [sh, -ceu, "tool=$(command -v readelf || command -v llvm-readelf || true); [ -n \"$tool\" ] || { echo \"readelf or llvm-readelf is required\" >&2; exit 1; }; if ! headers=$(\"$tool\" -lW \"$1\"); then echo \"failed to inspect ELF program headers\" >&2; exit 1; fi; found=0; for alignment in $(printf '%s\\n' \"$headers\" | awk '$1 == \"LOAD\" {print $NF}'); do found=1; if [ $((alignment)) -lt 16384 ]; then echo \"LOAD alignment $alignment is below 0x4000\" >&2; exit 1; fi; done; [ \"$found\" -eq 1 ] || { echo \"no ELF LOAD segments found\" >&2; exit 1; }", sh, "{{ variables.library_path }}"]
        - id: export
          type: export_artifact
          needs: [verify_page_size]
          artifact: portable_pty_rs
          primary: "{{ variables.library_path }}"

    - target: {os: android, architecture: arm}
      steps: *cross_dynamic_steps
    - target: {os: android, architecture: x64}
      steps: *cross_dynamic_steps

    - target: {os: ios, architecture: arm64, sdk: iphoneos}
      steps: &cargo_static_steps
        - id: build
          type: command
          working_directory: "{{ source.path }}/rust"
          commands:
            - [cargo, build, --manifest-path, "{{ variables.cargo_manifest }}", --release, --target, "{{ target.rust_target }}"]
        - id: export
          type: export_artifact
          artifact: portable_pty_rs
          kind: static_library
          primary: "{{ variables.library_path }}"

    - target: {os: ios, architecture: arm64, sdk: iphonesimulator}
      steps: *cargo_static_steps
    - target: {os: ios, architecture: x64, sdk: iphonesimulator}
      steps: *cargo_static_steps

artifacts:
  linux-x64:
    archive: pty-linux-x64.tar.gz
  linux-arm64:
    archive: pty-linux-arm64.tar.gz
  macos-arm64:
    archive: pty-macos-arm64.tar.gz
  macos-x64:
    archive: pty-macos-x64.tar.gz
  windows-x64:
    archive: pty-windows-x64.tar.gz
  windows-arm64:
    archive: pty-windows-arm64.tar.gz
  android-arm64:
    archive: pty-android-arm64.tar.gz
  android-arm:
    archive: pty-android-arm.tar.gz
  android-x64:
    archive: pty-android-x64.tar.gz
  ios-arm64:
    archive: pty-ios-arm64.tar.gz
    payload: {type: static_library}
  ios-sim-arm64:
    archive: pty-ios-sim-arm64.tar.gz
    payload: {type: static_library}
  ios-sim-x64:
    archive: pty-ios-sim-x64.tar.gz
    payload: {type: static_library}
