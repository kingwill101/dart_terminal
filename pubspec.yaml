name: dart_terminal_workspace
publish_to: none

environment:
  sdk: ^3.10.4

workspace:
  - pkgs/vte/ghostty_vte
  - pkgs/vte/ghostty_vte/example
  - pkgs/vte/ghostty_vte_flutter
  - pkgs/vte/ghostty_vte_flutter/example
  - pkgs/pty/portable_pty
  - pkgs/pty/portable_pty_flutter
  - pkgs/pty/portable_pty_flutter/example

dependency_overrides:
  # Flutter 3.44 pins flutter_test to meta 1.18 while hooks 2.x needs meta 1.19.
  meta: 1.19.0
