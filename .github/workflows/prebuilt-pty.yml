name: Prebuilt PTY Libraries

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. portable_pty-v0.0.4). If empty, artifacts are uploaded but no release is created."
        required: false
        type: string
      prerelease:
        description: "Mark the GitHub release as a prerelease."
        required: false
        default: false
        type: boolean

  push:
    tags:
      - "portable_pty-v*"

permissions:
  contents: write

env:
  RUST_VERSION: "1.92.0"

jobs:
  # ════════════════════════════════════════════════════════════════════
  #  PTY — Rust cross-compiled shared libraries
  # ════════════════════════════════════════════════════════════════════
  pty-native:
    name: "PTY ${{ matrix.os_label }}"
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Linux ──
          - runner: ubuntu-latest
            rust_target: x86_64-unknown-linux-gnu
            artifact: libportable_pty_rs.so
            os_label: linux-x64
            cross: false
          - runner: ubuntu-latest
            rust_target: aarch64-unknown-linux-gnu
            artifact: libportable_pty_rs.so
            os_label: linux-arm64
            cross: true

          # ── macOS ──
          - runner: macos-latest
            rust_target: aarch64-apple-darwin
            artifact: libportable_pty_rs.dylib
            os_label: macos-arm64
            cross: false
          - runner: macos-latest
            rust_target: x86_64-apple-darwin
            artifact: libportable_pty_rs.dylib
            os_label: macos-x64
            cross: false

          # ── Windows ──
          - runner: windows-latest
            rust_target: x86_64-pc-windows-msvc
            artifact: portable_pty_rs.dll
            os_label: windows-x64
            cross: false
          - runner: windows-latest
            rust_target: aarch64-pc-windows-msvc
            artifact: portable_pty_rs.dll
            os_label: windows-arm64
            cross: false

          # ── Android (cross from Linux) ──
          - runner: ubuntu-latest
            rust_target: aarch64-linux-android
            artifact: libportable_pty_rs.so
            os_label: android-arm64
            cross: true
          - runner: ubuntu-latest
            rust_target: armv7-linux-androideabi
            artifact: libportable_pty_rs.so
            os_label: android-arm
            cross: true
          - runner: ubuntu-latest
            rust_target: x86_64-linux-android
            artifact: libportable_pty_rs.so
            os_label: android-x64
            cross: true

          # ── iOS (from macOS) ──
          - runner: macos-latest
            rust_target: aarch64-apple-ios
            artifact: libportable_pty_rs.a
            os_label: ios-arm64
            cross: false
          - runner: macos-latest
            rust_target: aarch64-apple-ios-sim
            artifact: libportable_pty_rs.a
            os_label: ios-sim-arm64
            cross: false
          - runner: macos-latest
            rust_target: x86_64-apple-ios
            artifact: libportable_pty_rs.a
            os_label: ios-sim-x64
            cross: false

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.rust_target }}

      - name: Install cross (for cross-compiled targets)
        if: ${{ matrix.cross }}
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Install Android NDK
        if: startsWith(matrix.os_label, 'android-')
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27c

      - name: Build PTY native library
        working-directory: pkgs/pty/portable_pty/rust
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.rust_target }}
          else
            cargo build --release --target ${{ matrix.rust_target }}
          fi
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        shell: bash

      - name: Package artifact
        run: |
          mkdir -p staging
          LIB=$(find pkgs/pty/portable_pty/rust/target/${{ matrix.rust_target }}/release -name '${{ matrix.artifact }}' -type f | head -1)
          if [ -z "$LIB" ]; then
            echo "::error::Could not find ${{ matrix.artifact }}"
            find pkgs/pty/portable_pty/rust/target/${{ matrix.rust_target }}/release -type f -name '*.so' -o -name '*.dylib' -o -name '*.dll' -o -name '*.a'
            exit 1
          fi
          cp "$LIB" staging/${{ matrix.artifact }}
          cd staging
          tar czf ../pty-${{ matrix.os_label }}.tar.gz ${{ matrix.artifact }}
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pty-${{ matrix.os_label }}
          path: pty-${{ matrix.os_label }}.tar.gz

  # ════════════════════════════════════════════════════════════════════
  #  Release — collect PTY artifacts and publish a GitHub release
  # ════════════════════════════════════════════════════════════════════
  release:
    name: Create Release
    if: startsWith(github.ref, 'refs/tags/portable_pty-v') || github.event.inputs.tag != ''
    needs: [pty-native]
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f | sort

      - name: Determine release metadata
        id: meta
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PRERELEASE="${{ github.event.inputs.prerelease }}"
          else
            VERSION="${TAG##*-v}"
            if printf '%s' "$VERSION" | grep -q -- '-'; then PRERELEASE=true; else PRERELEASE=false; fi
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "Tag: $TAG"
          echo "Prerelease: $PRERELEASE"

      - name: Generate native_prebuilt lockfile and release assets
        working-directory: pkgs/pty/portable_pty
        env:
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p built-library release-assets
          for archive in "$GITHUB_WORKSPACE"/artifacts/**/pty-*.tar.gz; do
            [ -f "$archive" ] || continue
            name=$(basename "$archive" .tar.gz)
            target=${name#pty-}
            mkdir -p "built-library/$target"
            tar xzf "$archive" -C "built-library/$target"
          done
          dart run native_prebuilt manifest update \
            --config native_prebuilt.yaml \
            --output native_prebuilt.lock.yaml \
            --built-library-dir built-library \
            --release-assets-dir release-assets \
            --tag "$RELEASE_TAG"
          find release-assets -type f -maxdepth 1 -print | sort

      - name: Upload generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: portable-pty-native-prebuilt-lock
          path: pkgs/pty/portable_pty/native_prebuilt.lock.yaml

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: "${{ steps.meta.outputs.tag }}"
          generate_release_notes: true
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
          fail_on_unmatched_files: true
          files: release-assets/*

  publish:
    name: Publish Dart packages
    if: needs.release.outputs.prerelease != 'true'
    needs: [release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - uses: actions/download-artifact@v4
        with:
          name: portable-pty-native-prebuilt-lock
          path: generated

      - name: Install dependencies
        run: flutter pub get

      - name: Install generated lockfile
        run: cp generated/native_prebuilt.lock.yaml pkgs/pty/portable_pty/native_prebuilt.lock.yaml

      - name: Validate package versions
        env:
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#portable_pty-v}"
          for package in pkgs/pty/portable_pty pkgs/pty/portable_pty_flutter; do
            actual=$(awk '/^version:/{print $2; exit}' "$package/pubspec.yaml")
            test "$actual" = "$VERSION" || {
              echo "$package has version $actual, expected $VERSION" >&2
              exit 1
            }
          done

      - name: Publish packages in dependency order
        run: |
          set -euo pipefail
          for package in pkgs/pty/portable_pty pkgs/pty/portable_pty_flutter; do
            for attempt in 1 2 3 4 5; do
              if (cd "$package" && dart pub publish --force); then
                break
              fi
              test "$attempt" != 5 || exit 1
              sleep 30
            done
          done

  update-lock:
    name: Commit native_prebuilt lockfile
    if: >-
      needs.release.outputs.prerelease != 'true' &&
      (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/'))
    needs: [release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@v4
        with:
          name: portable-pty-native-prebuilt-lock
          path: generated

      - name: Commit generated lockfile
        run: |
          set -euo pipefail
          cp generated/native_prebuilt.lock.yaml pkgs/pty/portable_pty/native_prebuilt.lock.yaml
          if git diff --quiet -- pkgs/pty/portable_pty/native_prebuilt.lock.yaml; then
            echo "No native_prebuilt lockfile changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pkgs/pty/portable_pty/native_prebuilt.lock.yaml
          git commit -m "chore: refresh portable_pty native prebuilts [skip ci]"
          git push origin HEAD:master

  # ════════════════════════════════════════════════════════════════════
  #  Update asset hashes — regenerate and commit after release
  # ════════════════════════════════════════════════════════════════════
  update-hashes:
    name: Update Asset Hashes
    if: needs.release.outputs.prerelease != 'true'
    needs: [release, update-lock]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Generate asset hashes
        run: dart run tool/write_asset_hashes.dart --tag ${{ needs.release.outputs.tag }} --package pty
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push updated hashes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pkgs/pty/portable_pty/lib/src/hook/asset_hashes.dart
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update asset hashes for ${{ needs.release.outputs.tag }}"
            git push
          fi
